# TOML syntax demonstration for theme preview.

[meta]
name = "Black Warm"
version = "1.0.0"
description = "Warm dark theme for editors"

[author]
name = "saime-0"
email = "acc.saime.d@gmail.com"

[config]
workers = 4
max_retry = 3
timeout = 30_000
debug = false
ratio = 3.14159
tags = ["dark", "warm", "minimal"]
created = 2024-01-15T10:30:00Z

[config.nested.deep]
value = true
list = [1, 2, 3]

[[tasks]]
id = 1
name = "build"
status = "done"
priority = 5

[tasks.meta]
duration = 120
cached = true

[[tasks]]
id = 2
name = "test"
status = "running"
priority = 3

[tasks.meta]
attempt = 2
parallel = false

# Multiline values
[strings]
basic = "string with \"quotes\""
literal = 'raw string without \escape'
multiline_basic = """
first line
second line
third line"""
multiline_literal = '''
raw multiline
without \processing'''

# Inline tables
[colors]
red = { hex = "cd5c60", rgb = [205, 92, 96] }
green = { hex = "507C3B", rgb = [80, 124, 59] }
blue = { hex = "6897BB", rgb = [104, 151, 187] }
