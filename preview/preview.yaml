# YAML syntax demonstration for theme preview.

meta:
  name: "Black Warm"
  version: "1.0.0"
  description: Warm dark theme for editors

author:
  name: saime-0
  email: acc.saime.d@gmail.com
  url: ~

config:
  workers: 4
  max_retry: 3
  timeout: 30000
  debug: false
  ratio: 3.14159
  tags:
    - dark
    - warm
    - minimal
  empty: []
  nested:
    deep:
      value: true
      list: [1, 2, 3]

# Various value types
types:
  string_plain: just a string
  string_quoted: "string with \"quotes\""
  string_single: 'without escape'
  integer: 42
  hex: 0xFF
  float: 3.14
  scientific: 1.5e+10
  boolean_true: true
  boolean_false: false
  null_tilde: ~
  null_word: null
  date: 2024-01-15
  datetime: 2024-01-15T10:30:00Z

# Multiline
multiline:
  literal: |
    first line
    second line
    third line
  folded: >
    this will all be
    on one line
    when parsed

# Anchors & aliases
defaults: &defaults
  status: pending
  priority: 0
  retries: 3

tasks:
  - id: 1
    name: build
    <<: *defaults
    status: done
    priority: 5
    meta:
      duration: 120
      cached: true

  - id: 2
    name: test
    <<: *defaults
    status: running
    priority: 3

  - id: 3
    name: deploy
    <<: *defaults
    priority: 8
    tags: [prod, critical]

# Flow style
colors: {red: "#cd5c60", green: "#507C3B", blue: "#6897BB"}
